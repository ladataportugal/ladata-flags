<!-- ================= LADATA · MENU BAR (SITE HEADER) =================
     WHERE TO PASTE: Squarespace → Settings → Advanced → Code Injection → HEADER
     (paste the whole thing once; it then shows on every page of the site).
     Do NOT use a Code Block — a block only lives inside one page.

     It hides Squarespace's own header and adds top spacing so content is clear.

     ------------------------------------------------------------------
     THIS IS THE LEIRIA LAUNCH VERSION.  Built 30 Oct 2026.

     ⚠️ DO NOT PASTE THIS UNTIL LEIRIA IS ACTUALLY OPEN.

     It presents Leiria as open and bookable: no COMING SOON tag, a live
     status dot on the Leiria booking choice, and Memberships and Login that
     follow whichever location the visitor is looking at. Pasting it early
     tells every visitor the house is taking bookings.

     The bar that is live until then is the previous version, unchanged.

     Built from the Lovable design export, with four things merged in from the
     leiria-launch branch that the export did not have:
       - per-location links (Memberships, Login, logo) via data-ladata-nav
       - the SITE map and path-derived location
       - markActive(), called from paintLinks() so it runs AFTER the hrefs are
         repointed - running it before compares against Porto's URLs and never
         matches on a Leiria page
       - store() rather than a read()-named helper; read() already exists above
         as the scroll handler and a second declaration silently replaces it,
         which is how the bar once stopped shrinking on scroll

     NOT included, deliberately: the 75km geolocation redirect. It sends the
     visitor's IP to a third party and the privacy policy does not cover that
     yet. It is its own piece of work, not part of this launch.

     Book now is an explicit two-location chooser and does NOT follow the
     page's location. That is intended: the primary CTA offers the choice
     rather than guessing.
     ------------------------------------------------------------------

     LANGUAGE (Weglot): the EN/PT button calls Weglot automatically when the
     Weglot script is installed on the site (Squarespace extension or its own
     code injection). Nothing else to configure. If Weglot is missing, the
     button simply swaps its own label.

     COLOUR: the bar reads what is behind it and switches automatically —
     dark text over pale backgrounds, cream text on a dark glass pill over
     photography or dark sections. To force it on a section, add
     data-ladata-nav="light" (cream text) or data-ladata-nav="dark".
=================================================================== -->

<script>
(function(){
  var nav = document.getElementById('ladataNav');
  if(!nav) return;
  var panelRoot = document.getElementById('ladataNavPanelRoot');

  /* ---------- shrink on scroll (full lockup -> wordmark) ---------- */
  var frame = 0;
  function read(){
    nav.classList.toggle('is-stuck', window.pageYOffset > 24);
    tone();
  }
  function onScroll(){
    if(frame) return;
    frame = window.requestAnimationFrame(function(){ frame = 0; read(); });
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll, {passive:true});

  /* ---------- adaptive colour: read what sits behind the bar ---------- */
  function parse(color){
    var m = /rgba?\(([^)]+)\)/.exec(color || '');
    if(!m) return null;
    var p = m[1].split(',').map(function(v){ return parseFloat(v); });
    if(p.length > 3 && p[3] < 0.45) return null;      /* see-through: keep looking up */
    return p;
  }
  function luminance(p){ return (0.2126*p[0] + 0.7152*p[1] + 0.0722*p[2]) / 255; }
  function sample(x, y){
    var stack = document.elementsFromPoint(x, y) || [];
    for(var i = 0; i < stack.length; i++){
      var el = stack[i];
      if(el.closest && el.closest('.ladata-nav')) continue;
      var node = el;
      while(node && node.nodeType === 1){
        var forced = node.getAttribute && node.getAttribute('data-ladata-nav');
        if(forced === 'light') return 0;               /* forced cream text */
        if(forced === 'dark') return 1;                /* forced dark text */
        var cs = window.getComputedStyle(node);
        if(cs.backgroundImage && cs.backgroundImage !== 'none') return 'media';
        if(node.tagName === 'IMG' || node.tagName === 'VIDEO') return 'media';
        var p = parse(cs.backgroundColor);
        if(p) return luminance(p);
        node = node.parentElement;
      }
    }
    return 1;
  }
  function tone(){
    var y = Math.min(window.innerHeight - 2, nav.getBoundingClientRect().bottom + 6);
    var w = window.innerWidth;
    var values = [sample(w*0.10, y), sample(w*0.5, y), sample(w*0.9, y)];
    var media = false, sum = 0, count = 0;
    values.forEach(function(v){
      if(v === 'media'){ media = true; return; }
      sum += v; count++;
    });
    /* only real dark backgrounds get the dark glass pill; photography keeps the pale one */
    var light = !media && count > 0 && (sum / count) < 0.5;
    nav.classList.toggle('ladata-nav--light', light);
    nav.classList.toggle('ladata-nav--onmedia', media && !light);
    if(panelRoot){
      panelRoot.classList.toggle('ladata-nav--light', light);
      panelRoot.classList.toggle('ladata-nav--onmedia', media && !light);
    }
  }
  read();
  window.setTimeout(read, 400);
  window.addEventListener('load', read);

  /* ---------- mark the current page ---------- */
  var here = window.location.pathname.replace(/\/$/,'');
  document.querySelectorAll('.ladata-nav__link, .ladata-nav__panelLink').forEach(function(a){
    var path = (a.getAttribute('href')||'').replace(/^https?:\/\/[^/]+/,'').replace(/\/$/,'');
    if(path && path === here) a.classList.add('is-active');
  });

  /* ---------- mobile panel ---------- */
  var burger = nav.querySelector('[data-ladata-burger]');
  var panel = panelRoot ? panelRoot.querySelector('.ladata-nav__panel') : null;
  function setOpen(open){
    nav.classList.toggle('is-open', open);
    if(panelRoot) panelRoot.classList.toggle('is-open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
    document.body.style.overflow = open ? 'hidden' : '';
  }
  burger.addEventListener('click', function(){ setOpen(!nav.classList.contains('is-open')); });
  panel.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', function(){ setOpen(false); }); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') setOpen(false); });

  /* ---------- booking location chooser ---------- */
  function closeBookings(except){
    document.querySelectorAll('[data-ladata-booking]').forEach(function(root){
      if(root === except) return;
      root.classList.remove('is-open');
      var toggle = root.querySelector('[data-ladata-booking-toggle]');
      var choices = root.querySelector('.ladata-nav__bookingChoices');
      if(toggle){ toggle.setAttribute('aria-expanded','false'); toggle.setAttribute('aria-label','Choose a location to book'); }
      if(choices) choices.setAttribute('aria-hidden','true');
      root.querySelectorAll('.ladata-nav__bookingChoice').forEach(function(link){ link.setAttribute('tabindex','-1'); });
    });
  }
  document.querySelectorAll('[data-ladata-booking-toggle]').forEach(function(toggle){
    toggle.addEventListener('click', function(e){
      e.stopPropagation();
      var root = toggle.closest('[data-ladata-booking]');
      if(!root) return;
      var open = !root.classList.contains('is-open');
      closeBookings(root);
      closeLocations();
      root.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.setAttribute('aria-label', open ? 'Close booking location choices' : 'Choose a location to book');
      var choices = root.querySelector('.ladata-nav__bookingChoices');
      if(choices) choices.setAttribute('aria-hidden', open ? 'false' : 'true');
      root.querySelectorAll('.ladata-nav__bookingChoice').forEach(function(link){ link.setAttribute('tabindex', open ? '0' : '-1'); });
    });
  });


  /* ---------- location selector ---------- */
  /* ---------- per-location URLs ----------
     Ported from the leiria-launch branch. Before this, the bar had no
     per-location links at all: Memberships and Login stayed pointed at Porto
     on every page, Leiria pages included, so a visitor reading about Leiria
     and clicking Memberships landed on Porto's.

     The selected location is derived from the PATH, never from storage, so the
     toggle can never disagree with the page you are actually on.

     Book now is deliberately NOT in here. It is an explicit two-location
     chooser in this design, which is the better behaviour for the primary CTA:
     it offers the choice rather than guessing from context. */
  var SITE = {
    matosinhos: {
      home:        'https://www.bookladata.com/',
      memberships: 'https://www.bookladata.com/memberships',
      login:       'https://ladata.as.me/'
    },
    leiria: {
      /* NOT /leiria - the founding offers page keeps that slug. The Leiria
         landing page is /landing-leiria. */
      home:        'https://www.bookladata.com/landing-leiria',
      memberships: 'https://www.bookladata.com/memberships-leiria',
      login:       'https://ladataleiria.as.me/'   /* separate Acuity account */
    }
  };
  /* The Experience, About and Contact are shared: Leiria has no versions yet.
     Add them to SITE when it does. */
  var LEIRIA_PATHS = ['/leiria','/landing-leiria','/memberships-leiria','/appointments-leiria'];
  var LOCATION_KEY = 'ladata:location';

  /* NOT named read(): a read() already exists above as the scroll handler, and
     a second declaration in the same scope silently replaces it. That bug shipped
     once already and stopped the bar shrinking on scroll. */
  function store(key, value){ try{ window.localStorage.setItem(key, value); }catch(_e){} }

  function linkSet(location){ return SITE[location] || SITE.matosinhos; }

  /* Marks the current page in the nav. Called from paintLinks(), AFTER the
     hrefs have been repointed - if it runs before, it compares the live path
     against Porto's URLs and never matches on a Leiria page. */
  function markActive(){
    var here = window.location.pathname.replace(/^\/(pt|en)(?=\/|$)/,'').replace(/\/$/,'');
    document.querySelectorAll('.ladata-nav__link, .ladata-nav__panelLink').forEach(function(a){
      var path = (a.getAttribute('href')||'').replace(/^https?:\/\/[^/]+/,'').replace(/\/$/,'');
      a.classList.toggle('is-current', path !== '' && path === here);
    });
  }

  function paintLinks(location){
    var set = linkSet(location);
    document.querySelectorAll('[data-ladata-nav]').forEach(function(link){
      var key = link.getAttribute('data-ladata-nav');
      if(set[key]) link.setAttribute('href', set[key]);
    });
    markActive();
  }
  function locationLabel(location){
    return location === 'leiria' ? '<span>LEIRIA</span>' : '<span>MATOSINHOS</span>';
  }
  function paintLocation(location){
    document.querySelectorAll('[data-ladata-location-toggle]').forEach(function(toggle){
      var label = toggle.querySelector('.ladata-nav__locationLabel');
      if(label) label.innerHTML = locationLabel(location);
      toggle.setAttribute('aria-label', toggle.closest('.ladata-nav__location--mobile')
        ? 'Choose location. Current location: ' + location
        : 'Location: ' + location);
    });
    document.querySelectorAll('[data-ladata-location-option]').forEach(function(option){
      var active = option.getAttribute('data-ladata-location-option') === location;
      option.classList.toggle('is-active', active);
      option.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }
  var locationPath = window.location.pathname.replace(/^\/(pt|en)(?=\/|$)/,'').replace(/\/$/,'') || '/';
  var pageLocation = LEIRIA_PATHS.indexOf(locationPath) > -1 ? 'leiria' : 'matosinhos';
  store(LOCATION_KEY, pageLocation);
  paintLocation(pageLocation);
  paintLinks(pageLocation);
  function closeLocations(except){
    document.querySelectorAll('[data-ladata-location]').forEach(function(root){
      if(root === except) return;
      root.classList.remove('is-open');
      var toggle = root.querySelector('[data-ladata-location-toggle]');
      if(toggle) toggle.setAttribute('aria-expanded', 'false');
      var choices = root.querySelector('.ladata-nav__locationChoices');
      if(choices) choices.setAttribute('aria-hidden','true');
      root.querySelectorAll('.ladata-nav__locationChoice').forEach(function(choice){ choice.setAttribute('tabindex','-1'); });
    });
  }
  document.querySelectorAll('[data-ladata-location-toggle]').forEach(function(toggle){
    toggle.addEventListener('click', function(e){
      e.stopPropagation();
      var root = toggle.closest('[data-ladata-location]');
      if(!root) return;
      var open = !root.classList.contains('is-open');
      closeBookings();
      closeLocations(root);
      root.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      var choices = root.querySelector('.ladata-nav__locationChoices');
      if(choices) choices.setAttribute('aria-hidden', open ? 'false' : 'true');
      root.querySelectorAll('.ladata-nav__locationChoice').forEach(function(choice){ choice.setAttribute('tabindex', open ? '0' : '-1'); });
    });
  });
  document.querySelectorAll('[data-ladata-location-option]').forEach(function(option){
    option.addEventListener('click', function(e){
      e.stopPropagation();
      var location = option.getAttribute('data-ladata-location-option');
      if(location !== 'leiria' && location !== 'matosinhos') return;
      store(LOCATION_KEY, location);
      paintLocation(location);
      paintLinks(location);
      closeLocations();
      window.location.href = linkSet(location).home;
    });
  });
  document.addEventListener('click', function(){ closeLocations(); closeBookings(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') { closeBookings(); closeLocations(); } });

  /* ---------- language: Weglot ---------- */
  var PAIR = ['en','pt'];
  function weglot(){ return window.Weglot && window.Weglot.initialized ? window.Weglot : null; }
  function currentLang(){
    var w = weglot();
    if(w && w.getCurrentLang) return String(w.getCurrentLang()).toLowerCase();
    var html = (document.documentElement.getAttribute('lang')||'en').slice(0,2).toLowerCase();
    return PAIR.indexOf(html) > -1 ? html : 'en';
  }
  function paint(){
    var on = currentLang();
    var off = on === PAIR[0] ? PAIR[1] : PAIR[0];
    document.querySelectorAll('[data-ladata-lang]').forEach(function(btn){
      var current = btn.querySelector('[data-on]');
      var target = btn.querySelector('[data-off]');
      if(current) current.textContent = on.toUpperCase();
      if(target) target.textContent = off.toUpperCase();
      btn.setAttribute('aria-label', 'Language: ' + on.toUpperCase() + '. Switch to ' + off.toUpperCase());
    });
  }
  function switchLang(){
    var on = currentLang();
    var target = on === PAIR[0] ? PAIR[1] : PAIR[0];
    var w = weglot();
    if(w && w.switchTo){ w.switchTo(target); window.setTimeout(paint, 60); return; }
    /* Weglot not loaded yet: fall back to its URL scheme (/pt/... ) */
    var path = window.location.pathname.replace(/^\/(pt|en)(?=\/|$)/,'') || '/';
    window.location.href = (target === PAIR[0] ? path : '/' + target + path) + window.location.search;
  }
  document.querySelectorAll('[data-ladata-lang]').forEach(function(btn){
    btn.addEventListener('click', switchLang);
  });
  paint();
  function bindWeglot(){
    var w = weglot();
    if(!w){ return false; }
    if(w.on) w.on('languageChanged', paint);
    paint();
    return true;
  }
  if(!bindWeglot()){
    var tries = 0;
    var poll = window.setInterval(function(){
      if(bindWeglot() || ++tries > 40) window.clearInterval(poll);
    }, 250);
  }
})();
</script>
